[package]
name = "crypto_core_rs"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "crypto_core_rs"
crate-type = ["rlib"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
crc32fast = "1.4"
byteorder = "1.5"
rayon = "1.10"
flate2 = "1.0"
xz2 = "0.1"
tempfile = "3.10"
zeroize = "1.8"
