[package]
name = "crypto_core_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "crypto_core_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
crc32fast = "1.4"
byteorder = "1.5"
flate2 = "1.0"
xz2 = "0.1"
tempfile = "3.10"
