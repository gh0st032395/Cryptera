[package]
name = "crypto_tauri"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = "2.5"

[dependencies]
tauri = { version = "2.5" }
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = { version = "0.8", features = ["serde"] }
crypto_core_rs = { path = ".." }
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
tar = "0.4"
tempfile = "3.10"
walkdir = "2.5"
