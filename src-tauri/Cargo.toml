[package]
name = "crypto_tauri"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-dialog = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = { version = "0.8", features = ["serde"] }
crypto_core_rs = { path = "..", version = "=1.1.0" }
flate2 = "1.0"
bzip2 = "0.4"
xz2 = "0.1"
tar = "0.4"
tempfile = "3.10"
walkdir = "2.5"
