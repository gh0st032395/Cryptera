name: Rust CI

on:
  push:
    branches: ["main", "master", "test-versione-finale-rust---tauri-gui"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Core library tests ────────────────────────────────────────────────────
  test-core:
    name: Test (core — ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (crypto_core_rs)
        run: cargo test --all-features

  # ── Tauri backend tests ───────────────────────────────────────────────────
  test-tauri:
    name: Test (tauri backend — ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo test (crypto_tauri)
        working-directory: src-tauri
        run: cargo test

  # ── Clippy lints ─────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: clippy (core)
        run: cargo clippy --all-features -- -D warnings

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: clippy (tauri backend)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  # ── Format check ─────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: fmt check (core)
        run: cargo fmt -- --check

      - name: fmt check (tauri backend)
        working-directory: src-tauri
        run: cargo fmt -- --check

  # ── Version alignment ────────────────────────────────────────────────────
  version-check:
    name: Version alignment
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate versions
        shell: pwsh
        run: ./scripts/check-version.ps1
