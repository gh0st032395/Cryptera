name: Release

# Builds signed installers for Windows, macOS and Linux when a version tag
# is pushed, generates the updater manifest (latest.json) and attaches
# everything to a DRAFT GitHub release plus a SHA256SUMS.txt file. The
# release must be reviewed and published by hand.
#
# Required secrets for the auto-updater (generate once with
# `cargo tauri signer generate`, see RELEASE.md):
#   TAURI_SIGNING_PRIVATE_KEY           — the updater private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password (may be empty)
# The matching PUBLIC key must be set as plugins.updater.pubkey in
# src-tauri/tauri.conf.json. OS code signing (Authenticode / Apple) is a
# separate, still-unconfigured step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify versions and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version alignment
        shell: pwsh
        run: ./scripts/check-version.ps1

      - name: Check tag matches VERSION
        run: |
          tag="${RELEASE_TAG#v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag $RELEASE_TAG does not match VERSION $ver" >&2
            exit 1
          fi

      - name: Reject placeholder updater public key
        run: |
          if grep -q "REPLACE_WITH_TAURI_UPDATER_PUBKEY" src-tauri/tauri.conf.json; then
            echo "::error::The updater public key is still the placeholder. Generate a key with 'cargo tauri signer generate', set plugins.updater.pubkey and the TAURI_SIGNING_PRIVATE_KEY secret before releasing (see RELEASE.md)." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run core tests
        run: cargo test

  build:
    name: Build bundles (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build, sign and publish to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cryptera ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Verify downloads against SHA256SUMS.txt."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── Scriptable CLI ────────────────────────────────────────────────────────
  # Standalone `cryptera` binary, no GUI and no webview: this is what CI jobs
  # and shell/PowerShell scripts drive. macOS gets a universal binary built
  # from both arches with lipo.
  cli:
    name: Build CLI (${{ matrix.platform }})
    # After `build`, not in parallel with it: tauri-action is what creates the
    # draft release these assets are uploaded to.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            asset: cryptera-cli-linux-x86_64.tar.gz
          - platform: windows-latest
            asset: cryptera-cli-windows-x86_64.zip
          - platform: macos-latest
            asset: cryptera-cli-macos-universal.tar.gz
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          tar -czf "${{ matrix.asset }}" -C cli/target/release cryptera

      - name: Build (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          Compress-Archive -Path cli/target/release/cryptera.exe -DestinationPath "${{ matrix.asset }}"

      - name: Build (macOS universal)
        if: startsWith(matrix.platform, 'macos')
        run: |
          cargo build --release --manifest-path cli/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --manifest-path cli/Cargo.toml --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/cryptera \
            cli/target/aarch64-apple-darwin/release/cryptera \
            cli/target/x86_64-apple-darwin/release/cryptera
          lipo -info dist/cryptera
          tar -czf "${{ matrix.asset }}" -C dist cryptera

      - name: Smoke test the built binary
        shell: bash
        env:
          CRYPTERA_PASSWORD: ci-smoke-test-password
        run: |
          set -eu
          case "${{ matrix.platform }}" in
            windows*) BIN=cli/target/release/cryptera.exe ;;
            macos*)   BIN=dist/cryptera ;;
            *)        BIN=cli/target/release/cryptera ;;
          esac
          echo "payload" > smoke.txt
          "$BIN" encrypt smoke.txt --quiet
          "$BIN" verify smoke.ecf --json --quiet
          rm smoke.txt
          "$BIN" decrypt smoke.ecf --quiet
          grep -q payload smoke.txt
          # A wrong password must exit 3, the contract scripts branch on.
          set +e
          CRYPTERA_PASSWORD=wrong "$BIN" verify smoke.ecf --quiet 2>/dev/null
          [ $? -eq 3 ] || { echo "expected exit 3 for a wrong password" >&2; exit 1; }

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber

  checksums:
    name: Attach SHA256SUMS
    needs: [build, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Compute and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
