[package]
name = "cryptera_cli"
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Scriptable command-line front-end for Cryptera"

[[bin]]
name = "cryptera"
path = "src/main.rs"

[dependencies]
crypto_core_rs = { path = "..", version = "=2.1.0" }
cryptera_ops = { path = "../ops", version = "=2.1.0" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
secrecy = "0.8"
rpassword = "7.3"
tempfile = "3.10"
