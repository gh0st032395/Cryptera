[tool.ruff]
line-length = 120
target-version = "py310"

[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N"]
ignore = ["N802", "N803", "N806"] # Allow lowercase function/arg names if legacy

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false # Keep it easy for now as per "minimi" requirement
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "crypto_core.*"
disallow_untyped_defs = true # Core should be typed

[project]
name = "cryptov2"
version = "3.0.0"
description = "Secure File Encryptor/Decryptor with ECC and AEAD"
dependencies = [
    "pycryptodome",
    "argon2-cffi",
    "numpy",
    "customtkinter",
    "pathvalidate"
]
requires-python = ">=3.10"

[project.scripts]
crypto = "crypto_core.cli:main"
