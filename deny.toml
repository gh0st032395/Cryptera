[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"
ignore = [
  # ── 2024 advisories (Tauri/GTK framework deps, not directly fixable) ─────
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",  # atk unmaintained (gtk-rs GTK3 bindings)
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",  # atk-sys unmaintained
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",  # glib unsound (VariantStrIter) - Tauri transitive dep
  # ── 2025 advisories ───────────────────────────────────────────────────────
  "RUSTSEC-2025-0057",  # fxhash unmaintained - Tauri/wry transitive dep
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained - urlpattern/tauri-utils
  "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained - urlpattern/tauri-utils
  # ── 2026 advisories ───────────────────────────────────────────────────────
  "RUSTSEC-2026-0097",  # rand unsound with custom logger - low practical risk
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
